function shell(x){document.getElementById("app").innerHTML=`<main class="screen fade"><section class="card"><span class="flower a">🌻</span><span class="flower b">🤍</span><span class="flower c">🌿</span><div class="content">${x}</div></section></main>`;window.scrollTo(0,0)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2400)}
function petals(){setInterval(()=>{let e=document.createElement("span");e.className="petal";e.textContent=["🌼","✿","❀","🤍"][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+"vw";e.style.setProperty("--x",(Math.random()*180-90)+"px");e.style.animationDuration=(5+Math.random()*6)+"s";document.getElementById("petals").appendChild(e);setTimeout(()=>e.remove(),12000)},1000)}
function renderReasons(){
  const box=document.getElementById("reasonsList");
  if(!box)return;
  box.innerHTML=LOVE_REASONS.map((r,i)=>`<div class="reason" style="animation-delay:${i*.28}s"><span class="reason-flower">${["🌻","🌼","🌷","🌿","🤍","❤️"][i]}</span><span class="reason-text">${r}</span></div>`).join("");
}
function typeText(el,text,speed=28){
  if(!el)return Promise.resolve();
  el.textContent="";
  const caret=document.createElement("span");caret.className="typing-caret";el.appendChild(caret);
  let i=0;
  return new Promise(resolve=>{
    function step(){
      if(i<text.length){caret.before(document.createTextNode(text[i++]));setTimeout(step,speed);}
      else{caret.remove();resolve();}
    }
    step();
  });
}

function countdown(){let t=new Date("2026-09-22T00:00:00"),d=Math.max(0,t-new Date());let a=[["روز",Math.floor(d/864e5)],["ساعت",Math.floor(d/36e5)%24],["دقیقه",Math.floor(d/6e4)%60],["ثانیه",Math.floor(d/1e3)%60]];let x=document.getElementById("count");if(x)x.innerHTML=a.map(v=>`<div class="box"><div class="num">${v[1]}</div><div class="lab">${v[0]}</div></div>`).join("")}
let ctx,master,timer;
const MUSIC_NOTES=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
function startMusic(){
  if(timer) return;
  try{
    if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.045;master.connect(ctx.destination)}
    const resume=()=>{if(ctx && ctx.state==="suspended")ctx.resume();startMusicLoop();};
    if(ctx.state==="suspended"){window.addEventListener("pointerdown",resume,{once:true});window.addEventListener("keydown",resume,{once:true});}else startMusicLoop();
  }catch(e){}
}
function startMusicLoop(){
  if(timer||!ctx)return;
  if(ctx.state==="suspended")return;
  let n=0;
  function tone(){let o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=MUSIC_NOTES[n++%MUSIC_NOTES.length];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.8);o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+1.9)}
  tone();timer=setInterval(tone,1900);
}
function stopMusic(){if(timer){clearInterval(timer);timer=null}if(ctx){try{ctx.suspend()}catch(e){}}}

  await typeText(document.getElementById("chapterTyping"),chapters[n][1],24);
}

(function clearLegacyFirstPhotos(){
  const flag="legacyFirstPhotosCleared_v1";
  if(!localStorage.getItem(flag)){
    try{
      Object.keys(localStorage).filter(k=>k.startsWith("memoryPhoto_")).forEach(k=>localStorage.removeItem(k));

})();

function memoryStorageKey(key){return "memoryPhoto_"+key}
function getMemoryPhoto(key){return localStorage.getItem(memoryStorageKey(key))}
function renderMemoryCard(item){
  const saved=getMemoryPhoto(item.key);
  return `<div class="future-card memory-card">
    <div class="ico">${item.icon}</div><b>${item.title}</b>
    ${saved?`<img class="memory-photo" src="${saved}" alt="${item.title}">`:`<div class="empty-photo">هنوز عکسی ثبت نشده 🌿</div>`}
    <label class="upload"><input type="file" accept="image/*" onchange="saveMemoryPhoto('${item.key}',this)">📷 انتخاب عکس</label>
    ${saved?`<div class="memory-actions"><button class="letter-btn" onclick="openMemoryLetter('${item.key}')">💌 نامه‌اش</button></div>`:""}
  </div>`;
}
function future(){
  shell(`<div class="center"><div class="kicker">فصل خاطره‌های آینده</div><div class="lock">🔓</div>
  <h2>اولین‌های قشنگمون</h2>
  <p>هر وقت یکی از این اولین‌های قشنگمون اتفاق افتاد، عکسش رو اینجا نگه دار تا نامه‌ی مخصوص همون خاطره باز بشه. ❤️</p>
  <div class="future-grid">${MEMORY_ITEMS.map(renderMemoryCard).join("")}</div>
  <div class="nav"><button class="secondary" onclick="chapter(2)">← قبلی</button><button onclick="finalPage()">پایان →</button></div></div>`);
}
function saveMemoryPhoto(key,inp){
  if(!inp.files || !inp.files[0]) return;
  const file=inp.files[0];
  if(!file.type.startsWith("image/")){toast("لطفاً یک عکس انتخاب کن 📷");return}
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const maxSide=1600, scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const data=canvas.toDataURL("image/jpeg",.82);
      try{
        localStorage.setItem(memoryStorageKey(key),data);
        future();
        setTimeout(()=>openMemoryLetter(key),80);
        toast("عکس خاطره ذخیره شد ❤️");
      }catch(err){toast("ذخیره عکس ممکن نشد؛ عکس کوچک‌تری انتخاب کن.")}
    };
    img.onerror=()=>toast("خواندن عکس ممکن نشد.");
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
function openMemoryLetter(key){
  const item=MEMORY_ITEMS.find(x=>x.key===key),src=getMemoryPhoto(key);
  if(!item||!src)return;
  document.getElementById("modalTitle").textContent=item.icon+" "+item.title;
  document.getElementById("modalPhoto").src=src;
  document.getElementById("modalPhoto").alt=item.title;
  document.getElementById("modalLetter").textContent="";
  const modal=document.getElementById("memoryModal");
  modal.classList.add("show");modal.setAttribute("aria-hidden","false");
  typeText(document.getElementById("modalLetter"),MEMORY_LETTERS[key]||"",32);
}
function closeMemoryLetter(){
  const modal=document.getElementById("memoryModal");
  modal.classList.remove("show");modal.setAttribute("aria-hidden","true");
}
document.addEventListener("click",e=>{if(e.target===document.getElementById("memoryModal"))closeMemoryLetter()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMemoryLetter()});
function gateStart(){
  const unlockAt=new Date("2026-09-22T00:00:00");
  if(new Date()<unlockAt){toast("هنوز ۳۱ شهریور نشده شیطون 😌❤️");return}
  chapter(0);
}

<p>از این به بعد دعوا نمی‌کنیم. حالا اگه یوقت خدایی نکرده دعوامون شد میایم اینجا دعوا میکنیم</p>

function firebaseReady(){return firebaseConfig.apiKey&&firebaseConfig.apiKey!=="YOUR_API_KEY"&&firebaseConfig.projectId!=="YOUR_PROJECT_ID"}
async function initChat(){
if(!firebaseReady()){return {ok:false,msg:"چت هنوز وصل نشده؛ مشخصات Firebase را داخل index.html قرار بده."}}
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);await firebase.auth().signInAnonymously();db=firebase.firestore();return {ok:true}}catch(e){return {ok:false,msg:"اتصال چت انجام نشد: "+e.message}}
}
async function chat(){
stopMusic();
shell(`<div class="chat-wrap"><div class="chat-head"><h2>اتاق دعوای دختر بغلیم 😂❤️</h2><button class="secondary" onclick="finalPage()">← برگشت</button></div><div class="name-row"><span>اسم من:</span><input id="chatName" maxlength="30" placeholder="مثلاً دخترم"><span id="chatStatus" class="status">در حال اتصال...</span></div><div id="messages" class="messages"></div><div class="composer"><input id="msgInput" maxlength="500" placeholder="حرفت رو بزن..."><button onclick="sendMsg()">ارسال</button></div><p class="hint">هر پیامی که ارسال شود، آخرش خودکار «دوست دارم 😂😂😂😂😂» اضافه می‌شود.</p></div>`);
let n=localStorage.getItem("chatName");if(n)document.getElementById("chatName").value=n;
const r=await initChat();document.getElementById("chatStatus").textContent=r.ok?"🟢 آنلاین":"🔴 "+r.msg;
if(!r.ok){document.getElementById("messages").innerHTML=`<div class="future"><h3>چت هنوز راه‌اندازی نشده</h3><p>${r.msg}</p></div>`;return}
if(chatUnsub)chatUnsub();
chatUnsub=db.collection("coupleChat").orderBy("createdAt","asc").onSnapshot(s=>{let box=document.getElementById("messages");box.innerHTML="";s.forEach(d=>{let m=d.data(),mine=m.uid===firebase.auth().currentUser.uid;let el=document.createElement("div");el.className="msg "+(mine?"mine":"theirs");el.innerHTML=`<b>${esc(m.name||"عشق")}</b><div>${esc(m.text)}</div><div class="meta">${m.createdAt?.toDate?m.createdAt.toDate().toLocaleString("fa-IR"):""}</div>`;box.appendChild(el)});box.scrollTop=box.scrollHeight});
document.getElementById("msgInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()})
}
async function sendMsg(){let input=document.getElementById("msgInput"),name=document.getElementById("chatName");let text=input.value.trim();if(!text||!db)return;let nm=name.value.trim()||"دختر بغلیم";localStorage.setItem("chatName",nm);input.value="";await db.collection("coupleChat").add({uid:firebase.auth().currentUser.uid,name:nm,text:text+" ❤️ دوست دارم 😂😂😂😂😂",createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
petals();
if(new URLSearchParams(location.search).get("chat")==="1")chat();else start();
</script>
