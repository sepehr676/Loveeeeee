<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اتاق دعوای دختر بغلیم 😂❤️</title>
<style>body{margin:0;background:#f5f1e8;color:#32463d;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:760px;margin:30px auto;padding:18px}.card{background:#fffdf8;border:1px solid #ded8c9;border-radius:26px;padding:22px;box-shadow:0 12px 35px #0000000d}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e8e1d4;padding-bottom:15px}.messages{height:58vh;overflow:auto;padding:16px 4px;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:11px 14px;border-radius:18px;background:#eef2ec}.msg.mine{align-self:flex-start;background:#dfeadf}.msg.theirs{align-self:flex-end}.meta{font-size:11px;opacity:.55;margin-top:5px}.composer{display:flex;gap:8px}.composer input,.name{flex:1;padding:13px;border:1px solid #d9d2c5;border-radius:14px;font:inherit;background:#fff}.btn{border:0;border-radius:14px;padding:12px 18px;background:#7c9a84;color:white;font:inherit;cursor:pointer}.secondary{background:#eee9de;color:#46584e}.status{font-size:12px;opacity:.7}button:disabled{opacity:.5}@media(max-width:600px){.wrap{margin:8px auto;padding:10px}.card{padding:16px}.messages{height:60vh}.msg{max-width:90%}}</style></head>
<body><div class="wrap"><div class="card"><div class="head"><h2>اتاق دعوای دختر بغلیم 😂❤️</h2><button class="btn secondary" onclick="location.href='index.html'">← برگشت</button></div><p><span class="status" id="status">در حال اتصال...</span></p><div style="display:flex;gap:8px;margin-bottom:10px"><input id="name" class="name" maxlength="30" placeholder="اسم من، مثلاً پسرت ❤️"></div><div id="messages" class="messages"></div><div class="composer"><input id="input" class="name" maxlength="500" placeholder="حرفت رو بزن..."><button id="send" class="btn">ارسال</button></div><p style="font-size:12px;opacity:.65">آخر هر پیام خودکار «❤️ دوست دارم 😂😂😂😂😂» اضافه می‌شود.</p></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>
const cfg=window.FIREBASE_CONFIG||{};let db,unsub;const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function start(){if(!cfg.apiKey||String(cfg.apiKey).startsWith('YOUR_')||!cfg.projectId||String(cfg.projectId).startsWith('YOUR_')){$('status').textContent='🔴 Firebase هنوز تنظیم نشده';return}try{if(!firebase.apps.length)firebase.initializeApp(cfg);await firebase.auth().signInAnonymously();db=firebase.firestore();$('status').textContent='🟢 آنلاین';const saved=localStorage.getItem('chatName');if(saved)$('name').value=saved;unsub=db.collection('coupleChat').orderBy('createdAt','asc').onSnapshot(s=>{const box=$('messages');box.innerHTML='';s.forEach(d=>{const m=d.data(),el=document.createElement('div');el.className='msg '+(m.uid===firebase.auth().currentUser.uid?'mine':'theirs');el.innerHTML='<b>'+esc(m.name||'عشق')+'</b><div>'+esc(m.text||'')+'</div><div class="meta">'+(m.createdAt?.toDate?m.createdAt.toDate().toLocaleString('fa-IR'):'در حال ارسال...')+'</div>';box.appendChild(el)});box.scrollTop=box.scrollHeight},e=>{$('status').textContent='🔴 خطای دریافت پیام: '+e.message});}catch(e){$('status').textContent='🔴 اتصال انجام نشد: '+e.message}}
async function send(){const input=$('input'),name=$('name'),text=input.value.trim();if(!text||!db)return;const nm=name.value.trim()||'دختر بغلیم';$('send').disabled=true;input.value='';try{localStorage.setItem('chatName',nm);await db.collection('coupleChat').add({uid:firebase.auth().currentUser.uid,name:nm,text:text+' ❤️ دوست دارم 😂😂😂😂😂',createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){input.value=text;$('status').textContent='🔴 ارسال نشد: '+e.message}finally{$('send').disabled=false}}$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});start();</script></body></html>
